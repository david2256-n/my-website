<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Cart</title>
    <link rel="stylesheet" href="./css/Assignment.css">
</head>

<body>
    <h1>Products Cart</h1>
    <section class="products">
        <div class="product-card">
            <div class="image-box">
                <img src="./images/nike.webp" alt="Nike Air Max">
            </div>
            <button class="cart-btn">Add to Cart</button>
            <div class="product-info">
                <span class="new">New</span>
                <h2>Nike Air Max</h2>
                <div class="bottom">
                    <p>$104</p>
                    <button class="buy-btn">Buy</button>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="image-box">
                <img src="./images/Nike1.webp" alt="Nike Air Max">
            </div>
            <button class="cart-btn">Add to cart</button>
            <div class="product-info">
                <span class="new">New</span>
                <h2>Nike Air Max</h2>
                <div class="bottom">
                    <p>$106</p>
                    <button class="buy-btn">Buy</button>
                </div>
            </div>
        </div>

        <div class="product-card">
            <div class="image-box">
                <img src="./images/nike3.webp" alt="Nike Air Max">
            </div>
            <button class="cart-btn">Add to cart</button>
            <div class="product-info">
                <span class="new">New</span>
                <h2>Nike Air Max</h2>
                <div class="bottom">
                    <p>$104</p>
                    <button class="buy-btn">Buy</button>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
